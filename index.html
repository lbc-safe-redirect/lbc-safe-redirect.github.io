<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Redirection en cours…</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 36rem; margin: 15vh auto; padding: 0 1.5rem; color: #252525; }
    .error { color: #a31515; }
  </style>
</head>
<body>
  <p id="status">Redirection en cours…</p>
  <p><a id="manual" hidden>Ouvrir le lien</a></p>
  <noscript>JavaScript doit être activé pour ouvrir ce lien.</noscript>
  <script>
    (() => {
      const status = document.getElementById('status');
      const manual = document.getElementById('manual');
      const params = new URLSearchParams(window.location.search);
      const segments = window.location.pathname.split('/').filter(Boolean);
      const pathToken = segments.at(-1) || '';
      const hashToken = decodeURIComponent(window.location.hash.slice(1));
      const token = (params.get('t') || hashToken || pathToken || '').trim();

      if (!/^[A-Za-z0-9_-]{1,80}$/.test(token)) {
        status.textContent = 'Ce lien est introuvable.';
        status.className = 'error';
        return;
      }

      const rawUrl = 'https://raw.githubusercontent.com/lbc-safe-redirect/lbc-safe-redirect.github.io/main/redirects.json';
      const pagesUrl = 'https://lbc-safe-redirect.github.io/redirects.json';
      const apiUrl = 'https://api.github.com/repos/lbc-safe-redirect/lbc-safe-redirect.github.io/contents/redirects.json?ref=main';

      const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
      const fetchWithTimeout = async (url, decodeApi = false) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 7000);
        try {
          const separator = url.includes('?') ? '&' : '?';
          const response = await fetch(url + separator + 'ts=' + Date.now(), {
            cache: 'no-store',
            headers: { 'Accept': 'application/json' },
            signal: controller.signal,
          });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const body = await response.json();
          if (!decodeApi) return body;
          const binary = atob(String(body.content || '').replace(/\s/g, ''));
          const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
          return JSON.parse(new TextDecoder().decode(bytes));
        } finally {
          clearTimeout(timer);
        }
      };

      const targetFrom = redirects => {
        const target = redirects && redirects[token];
        return typeof target === 'string' && /^https?:\/\//i.test(target) ? target : '';
      };

      const resolveTarget = async () => {
        for (const delay of [0, 700, 1600, 3000]) {
          if (delay) await pause(delay);
          const primary = await Promise.allSettled([
            fetchWithTimeout(rawUrl),
            fetchWithTimeout(pagesUrl),
          ]);
          for (const result of primary) {
            const target = result.status === 'fulfilled' ? targetFrom(result.value) : '';
            if (target) return target;
          }
        }
        return targetFrom(await fetchWithTimeout(apiUrl, true));
      };

      resolveTarget().then(target => {
        if (!target) throw new Error('unknown token');
        manual.href = target;
        manual.hidden = false;
        manual.textContent = 'Cliquez ici si la redirection ne démarre pas.';
        window.location.replace(target);
      }).catch(() => {
        status.textContent = 'Ce lien est introuvable ou temporairement indisponible. Veuillez réessayer.';
        status.className = 'error';
      });
    })();
  </script>
</body>
</html>
