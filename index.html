<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title></title>
</head>
<body hidden>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const segments = window.location.pathname.split('/').filter(Boolean);
      const pathToken = segments.at(-1) || '';
      let hashToken = '';
      try { hashToken = decodeURIComponent(window.location.hash.slice(1)); } catch (_) {}
      const token = (params.get('t') || hashToken || pathToken || '').trim();
      if (!/^[A-Za-z0-9_-]{1,80}$/.test(token)) return;

      const requestedRevision = (params.get('v') || '').trim();
      const revision = /^[0-9a-f]{40}$/i.test(requestedRevision) ? requestedRevision : 'main';
      const redirectsUrl = `https://raw.githubusercontent.com/lbc-safe-redirect/lbc-safe-redirect.github.io/${revision}/redirects.json`;
      fetch(redirectsUrl, { cache: 'no-store' })
        .then(response => {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.json();
        })
        .then(redirects => {
          const target = redirects[token];
          if (typeof target === 'string' && /^https?:\/\//i.test(target)) {
            window.location.replace(target);
          }
        })
        .catch(() => {});
    })();
  </script>
</body>
</html>
